name: Fix home greeting source

on:
  push:
    paths:
      - '.github/workflows/fix-home-greeting.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage greeting in App.tsx
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/mockup-sandbox/src/App.tsx')
          s = p.read_text()
          old = 'İyi Günler <strong>{MY_NAME}</strong>'
          new = 'İyi günler <strong>{MY_NAME}</strong>'
          if old not in s:
              raise SystemExit('Target greeting not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/mockup-sandbox/src/App.tsx
          git commit -m 'fix: lowercase homepage greeting'
          git push
