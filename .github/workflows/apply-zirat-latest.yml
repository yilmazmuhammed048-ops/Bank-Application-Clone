name: Apply latest Ziraat app update

on:
  push:
    paths:
      - '.github/workflows/apply-zirat-latest.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize homepage balance safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('artifacts/mockup-sandbox/src/App.tsx')
          text = path.read_text()

          old_refresh = '  const refreshFromAdmin = () => {\n    const data = readAccountData();\n    setBalance(data.balance);\n    setTransactions(data.transactions);\n  };'
          new_refresh = '  const refreshFromAdmin = () => {\n    const data = readAccountData();\n\n    setBalance((current) =>\n      current === data.balance ? current : data.balance,\n    );\n\n    setTransactions((current) => {\n      const currentSignature = JSON.stringify(current);\n      const nextSignature = JSON.stringify(data.transactions);\n      return currentSignature === nextSignature ? current : data.transactions;\n    });\n  };'

          if old_refresh in text:
              text = text.replace(old_refresh, new_refresh, 1)
          elif new_refresh not in text:
              raise SystemExit('refreshFromAdmin block not found')

          old_effect = '  useEffect(() => {\n    const handleStorage = () => refreshFromAdmin();\n    window.addEventListener("storage", handleStorage);\n    return () => {\n      window.removeEventListener("storage", handleStorage);\n    };\n  }, []);'
          new_effect = '  useEffect(() => {\n    const handleStorage = () => refreshFromAdmin();\n    const handleFocus = () => refreshFromAdmin();\n    const handleVisibilityChange = () => {\n      if (document.visibilityState === "visible") {\n        refreshFromAdmin();\n      }\n    };\n\n    refreshFromAdmin();\n    window.addEventListener("storage", handleStorage);\n    window.addEventListener("focus", handleFocus);\n    document.addEventListener("visibilitychange", handleVisibilityChange);\n    const timer = window.setInterval(refreshFromAdmin, 1000);\n\n    return () => {\n      window.removeEventListener("storage", handleStorage);\n      window.removeEventListener("focus", handleFocus);\n      document.removeEventListener("visibilitychange", handleVisibilityChange);\n      window.clearInterval(timer);\n    };\n  }, []);'

          if old_effect in text:
              text = text.replace(old_effect, new_effect, 1)
          elif new_effect not in text:
              raise SystemExit('balance synchronization effect not found')

          path.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/mockup-sandbox/src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: keep homepage balance synced with latest movement'
          git push origin HEAD:main
