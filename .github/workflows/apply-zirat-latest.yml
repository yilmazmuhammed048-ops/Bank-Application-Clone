name: Apply latest Ziraat app update

on:
  push:
    paths:
      - '.github/workflows/apply-zirat-latest.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match incoming FAST card to reference
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('artifacts/mockup-sandbox/src/App.tsx')
          text = path.read_text()

          old = '''                {tx.kind === "credit" ? (
                  <>
                    <p className="truncate text-[12px] font-medium leading-[1.25] text-[#333d43]">
                      Gönd: {tx.recipientName.toLocaleUpperCase("tr-TR")}
                    </p>
                    <p className="mt-1 line-clamp-2 text-[11px] leading-[1.3] text-[#5f696e]">
                      {tx.subtitle.trim() && !/^FAST(?:\\s+FAST)*(?:\\s+işlemi)?$/i.test(tx.subtitle.trim())
              ? tx.subtitle.replace(/\\bFAST(?:\\s+FAST)+\\b/gi, "FAST")
              : "FAST işlemi"}
                    </p>
                    <p className="mt-1 truncate text-[10px] tracking-[0.01em] text-[#8a9195]">
                      {compactIban}
                    </p>
                  </>
                ) : ('''

          new = '''                {tx.kind === "credit" ? (
                  <>
                    <p className="truncate text-[12px] font-medium leading-[1.25] text-[#333d43]">
                      {/FAST/i.test(`${tx.title} ${tx.subtitle} ${tx.recipientName}`)
                        ? "Gelen FAST Para Transferi"
                        : tx.recipientName}
                    </p>
                    <p className="mt-1 truncate text-[10px] tracking-[0.01em] text-[#8a9195]">
                      {compactIban}
                    </p>
                  </>
                ) : ('''

          if old not in text:
              raise SystemExit('incoming FAST card block not found')

          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/mockup-sandbox/src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: match incoming FAST card to reference'
          git push origin HEAD:main
