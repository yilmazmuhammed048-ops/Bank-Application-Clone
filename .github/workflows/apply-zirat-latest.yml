name: Apply latest Ziraat app update

on:
  push:
    paths:
      - '.github/workflows/apply-zirat-latest.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stabilize homepage balance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('artifacts/mockup-sandbox/src/App.tsx')
          text = path.read_text()

          old = '''  useEffect(() => {
    const handleStorage = () => refreshFromAdmin();
    window.addEventListener("storage", handleStorage);
    const timer = window.setInterval(refreshFromAdmin, 1000);

    return () => {
      window.removeEventListener("storage", handleStorage);
      window.clearInterval(timer);
    };
  }, []);'''

          new = '''  useEffect(() => {
    const handleStorage = () => refreshFromAdmin();
    window.addEventListener("storage", handleStorage);

    return () => {
      window.removeEventListener("storage", handleStorage);
    };
  }, []);'''

          if old not in text:
              if 'window.setInterval(refreshFromAdmin, 1000)' in text:
                  raise SystemExit('balance poller block changed unexpectedly')
              raise SystemExit('balance poller block not found')

          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/mockup-sandbox/src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: stop homepage balance from flickering'
          git push origin HEAD:main
