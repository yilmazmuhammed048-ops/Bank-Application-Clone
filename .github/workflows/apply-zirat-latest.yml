name: Apply latest Ziraat app update

on:
  push:
    paths:
      - '.github/workflows/apply-zirat-latest.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep homepage balance synchronized with account movements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('artifacts/mockup-sandbox/src/App.tsx')
          text = path.read_text()

          old_refresh = '''  const refreshFromAdmin = () => {
    const data = readAccountData();
    setBalance(data.balance);
    setTransactions(data.transactions);
  };'''

          new_refresh = '''  const refreshFromAdmin = () => {
    const data = readAccountData();

    setBalance((current) =>
      current === data.balance ? current : data.balance,
    );

    setTransactions((current) => {
      const currentSignature = JSON.stringify(current);
      const nextSignature = JSON.stringify(data.transactions);
      return currentSignature === nextSignature ? current : data.transactions;
    });
  };'''

          if old_refresh in text:
              text = text.replace(old_refresh, new_refresh, 1)
          elif new_refresh not in text:
              raise SystemExit('refreshFromAdmin block not found')

          old_effect = '''  useEffect(() => {
    const handleStorage = () => refreshFromAdmin();
    window.addEventListener("storage", handleStorage);
    return () => {
      window.removeEventListener("storage", handleStorage);
    };
  }, []);'''

          new_effect = '''  useEffect(() => {
    const handleStorage = () => refreshFromAdmin();
    const handleFocus = () => refreshFromAdmin();
    const handleVisibilityChange = () => {
      if (document.visibilityState === "visible") {
        refreshFromAdmin();
      }
    };

    refreshFromAdmin();
    window.addEventListener("storage", handleStorage);
    window.addEventListener("focus", handleFocus);
    document.addEventListener("visibilitychange", handleVisibilityChange);

    const timer = window.setInterval(refreshFromAdmin, 1000);

    return () => {
      window.removeEventListener("storage", handleStorage);
      window.removeEventListener("focus", handleFocus);
      document.removeEventListener("visibilitychange", handleVisibilityChange);
      window.clearInterval(timer);
    };
  }, []);'''

          if old_effect in text:
              text = text.replace(old_effect, new_effect, 1)
          elif new_effect not in text:
              raise SystemExit('balance synchronization effect not found')

          path.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/mockup-sandbox/src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: keep homepage balance synced with latest movement'
          git push origin HEAD:main
