name: Apply latest Ziraat app update

on:
  push:
    paths:
      - '.github/workflows/apply-zirat-latest.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match incoming FAST card to reference safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('artifacts/mockup-sandbox/src/App.tsx')
          text = path.read_text()

          pattern = re.compile(
              r'''\{tx\.kind === "credit" \? \(\s*<>.*?</>\s*\) : \(''',
              re.S,
          )

          replacement = '''{tx.kind === "credit" ? (
                  <>
                    <p className="truncate text-[12px] font-medium leading-[1.25] text-[#333d43]">
                      {/FAST/i.test(`${tx.title} ${tx.subtitle} ${tx.recipientName}`)
                        ? "Gelen FAST Para Transferi"
                        : tx.recipientName}
                    </p>
                    <p className="mt-1 truncate text-[10px] tracking-[0.01em] text-[#8a9195]">
                      {compactIban}
                    </p>
                  </>
                ) : ('''

          text, count = pattern.subn(lambda m: replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'incoming FAST card patch count={count}')

          path.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/mockup-sandbox/src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: show incoming FAST exactly like reference'
          git push origin HEAD:main
