name: Apply latest Ziraat app update

on:
  push:
    paths:
      - '.github/workflows/apply-zirat-latest.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact transaction cards and remove duplicate fee text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('artifacts/mockup-sandbox/src/App.tsx')
          text = path.read_text()

          anchor = '          const compactIban = tx.recipientIban.replace(/\\s/g, "");\n'
          fee_logic = '          const isFeeMovement = /MESAJ ÜCRETİ TUTARI|BSMV TUTARI/i.test(\n            `${tx.title} ${tx.subtitle} ${tx.recipientName}`,\n          );\n'
          if 'const isFeeMovement =' not in text:
              if anchor not in text:
                  raise SystemExit('compactIban anchor not found')
              text = text.replace(anchor, anchor + fee_logic, 1)

          text = text.replace(
              'className="relative flex min-h-[104px] w-full overflow-hidden rounded-[9px] border border-[#e4e6e7] bg-white text-left shadow-[0_1px_1px_rgba(20,28,34,0.025)] transition-colors active:bg-[#fafafa]"',
              'className="relative flex h-[96px] w-full overflow-hidden rounded-[9px] border border-[#e4e6e7] bg-white text-left shadow-[0_1px_1px_rgba(20,28,34,0.025)] transition-colors active:bg-[#fafafa]"',
              1,
          )
          text = text.replace(
              'className="min-w-0 flex-1 py-[12px] pl-3 pr-[106px]"',
              'className="min-w-0 flex-1 py-[10px] pl-3 pr-[106px]"',
              1,
          )
          text = text.replace(
              '{tx.recipientBank}/',
              '{isFeeMovement ? null : `${tx.recipientBank}/`}',
              1,
          )
          text = text.replace(
              '                      {compactIban}\n                    </p>\n                    <p className="mt-1 line-clamp-2 text-[11px] leading-[1.3] text-[#5f696e]">\n                      {tx.recipientName} — {tx.subtitle}',
              '                      {isFeeMovement ? null : compactIban}\n                    </p>\n                    <p className="mt-1 line-clamp-1 text-[11px] font-medium leading-[1.3] text-[#5f696e]">\n                      {isFeeMovement\n                        ? (tx.title || tx.subtitle).toLocaleUpperCase("tr-TR")\n                        : tx.recipientName.trim().toLocaleUpperCase("tr-TR") === tx.subtitle.trim().toLocaleUpperCase("tr-TR")\n                          ? tx.subtitle\n                          : `${tx.recipientName} — ${tx.subtitle}`}',
              1,
          )

          if 'min-h-[104px]' in text or '{tx.recipientName} — {tx.subtitle}' in text:
              raise SystemExit('transaction card patch incomplete')

          path.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/mockup-sandbox/src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: compact transaction cards and remove duplicate fee labels'
          git push origin HEAD:main
