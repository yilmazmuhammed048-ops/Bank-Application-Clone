name: Apply latest Ziraat app update

on:
  push:
    paths:
      - '.github/workflows/apply-zirat-latest.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace app source and push
        shell: bash
        run: |
          cat .github/app_payload/c*.txt | base64 -d | gzip -d > artifacts/mockup-sandbox/src/App.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/mockup-sandbox/src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: sync transactions and receipt time'
          git push origin HEAD:main
